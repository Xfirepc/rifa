x-google-environment: &google-environment
  GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
  GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
  GOOGLE_AUTH_MODE: ${GOOGLE_AUTH_MODE:-oauth}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:${HTTP_PORT:-3008}/api/admin/sheets/oauth/callback}
  GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rifa
      POSTGRES_USER: rifa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifa -d rifa"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    image: ${RIFA_IMAGE:-family-rifa:local}
    restart: unless-stopped
    environment:
      <<: *google-environment
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: rifa
      PGUSER: rifa
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      ADMIN_PIN: ${ADMIN_PIN:?Define ADMIN_PIN en .env}
      SELLER_PIN: ${SELLER_PIN:?Define SELLER_PIN en .env}
    volumes:
      - prize_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/draw').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-3008}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  sheets-sync:
    image: ${RIFA_IMAGE:-family-rifa:local}
    build: .
    profiles: [sheets]
    restart: unless-stopped
    command: ["node", "scripts/sync-sheets.mjs"]
    stop_grace_period: 4m
    environment:
      <<: *google-environment
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: rifa
      PGUSER: rifa
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/google/service-account.json
    volumes:
      - ./secrets:/run/google:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  prize_uploads:
  caddy_data:
  caddy_config:
